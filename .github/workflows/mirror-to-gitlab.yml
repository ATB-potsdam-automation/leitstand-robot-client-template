name: Mirror to GitLab

on:
  push:
    branches: [ "*" ]
  delete:
    branches: [ "*" ]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@https://gitlab-extern.atb-potsdam.de/am/ki_reallabor/leitstand/leitstand-robot-client-template.git
          git push gitlab --all --force
          git push gitlab --tags --force
